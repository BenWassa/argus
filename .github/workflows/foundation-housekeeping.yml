name: Foundation housekeeping closeout

on:
  push:
    branches:
      - housekeeping/foundation-closeout-20260912

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: housekeeping/foundation-closeout-20260912
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Reconcile durable documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # README: Learn is broader than passive reading now, while Test remains
          # the sole formal evidence/retention interaction.
          replace_once(
              "README.md",
              "- **Learn** — ungraded reading/exposure. Every topic exposes its complete finite reference; topics may also carry optional typed explanatory support.\n",
              "- **Learn** — ungraded/formative acquisition. Ordinary topics use reading/exposure and their complete finite reference; progressive topics such as Morse may also use guided formative retrieval, replay and application activities. Learn never creates formal Test evidence or retention completion.\n",
          )

          # Programme plan: advance durable current-state authority through #87/#88.
          replace_once(
              "docs/MORSE_PROGRAMME_PLAN.md",
              "Current programme state: #75 lesson path/replay; corrected #76 shared A–Z reference; #77 direct auto-grading Morse key; #78 early word checkpoints  \n",
              "Current programme state: #75 lesson path/replay; corrected #76 shared A–Z reference; #77 direct Morse key; #78 early word checkpoints; #87 touch-safe shared keyed-response lifecycle; #88 seamless milestone checkpoint handoff  \n",
          )
          replace_once(
              "docs/MORSE_PROGRAMME_PLAN.md",
              "## Current implementation state through #78",
              "## Current implementation state through #88",
          )
          replace_once(
              "docs/MORSE_PROGRAMME_PLAN.md",
              "The first four all render the same shared `MorseKeyInput`. A fresh answer is\nblank. Tap/short press commits a dit and hold commits a dah. The caller provides\nthe expected element count; reaching it submits exactly once and grades\nimmediately. There is no Back/delete, Submit/Check or correction/confirmation\npath. Keyboard `.` and `-` use the same automatic grading behavior; Backspace\nand Enter are not response controls. Timing is not returned as evidence and\ntherefore cannot imply sending skill or WPM.\n",
              "The first four all render the same shared `MorseKeyInput`. A fresh answer is\nblank. Tap/short press classifies a dit and hold classifies a dah. The caller\nprovides the expected element count; reaching it commits exactly once, but #87\ndecouples that categorical input from complete audible element playback. The\nfinal accepted tone is allowed to finish before the answer boundary advances,\nthen the answer region stays locked through brief visible feedback and the small\ntarget transition before the next target becomes live. There is no Back/delete,\nSubmit/Check or correction/confirmation path. Keyboard `.` and `-` follow the\nsame gated contract; Backspace and Enter are not response controls. Timing is\nnot returned as evidence and therefore cannot imply sending skill or WPM.\n",
          )
          replace_once(
              "docs/MORSE_PROGRAMME_PLAN.md",
              "Checkpoint runs are local-only and write no lesson support,\nsitting, readiness, scheduler, Test evidence or completion state.\n\n## Decisions register",
              "Checkpoint runs are local-only and write no lesson support,\nsitting, readiness, scheduler, Test evidence or completion state.\n\n#87 makes the keyed answer boundary explicit across Learn, lesson replay and word\ncheckpoints. Dit/dah classification is separate from rendering the complete tone;\nthe final element finishes before progression, both correct and wrong feedback\nremain briefly visible, automatic advance is retained, and input stays locked\nthrough feedback/transition so the following target cannot receive a carry-over\ntap or key repeat. Reduced motion removes unnecessary animation but not the\nsafety gate. The Morse key communicates press through elevation/tone rather than\na blue/accent repaint. These are interaction changes only: Learn/Test evidence,\nscoring, acquisition and retention semantics are unchanged.\n\n#88 integrates the existing Lesson-4 and Lesson-7 checkpoints into the forward\njourney. When canonical progression newly unlocks one, lesson completion presents\na restrained invitation automatically. `Start checkpoint` enters it directly;\nskip/continue remains non-gating and leaves the checkpoint available on the path.\nReplay or repair of an already reached milestone does not manufacture a new\nfirst-unlock event, and checkpoint completion continues naturally into the\nlesson journey. Checkpoint work remains formative and non-evidentiary.\n\n## Decisions register",
          )
          replace_once(
              "docs/MORSE_PROGRAMME_PLAN.md",
              "| D13 | Early word application | Interstitial checkpoints after Lessons 4 and 7; mechanically eligible deterministic content; no gating or durable checkpoint state | Ratified | #78 |\n",
              "| D13 | Early word application | Interstitial checkpoints after Lessons 4 and 7; mechanically eligible deterministic content; no gating or durable checkpoint state | Ratified | #78 |\n| D14 | Keyed response boundary | Complete element audio, locked feedback/transition lifecycle, automatic advance and tactile non-blue key styling shared by Learn/replay/checkpoints | Ratified | #87 |\n| D15 | Checkpoint milestone handoff | Newly unlocking Lesson-4/7 checkpoints are invited automatically; direct start, non-gating skip, no replay/repair false retrigger | Ratified | #88 |\n",
          )
          replace_once(
              "docs/MORSE_PROGRAMME_PLAN.md",
              "#42, #51, #52, #56, #75, #76, #77 and #78 add no new durable schema field for\ntheir presentation/runtime concerns. The verbal phrase table, SVG rendering,\nWeb Audio schedule, direct Morse-key timing, lesson path/replay, reference-card\nplacement and word-checkpoint run state do not create learner-data stores.",
              "#42, #51, #52, #56, #75, #76, #77, #78, #87 and #88 add no new durable schema\nfield for their presentation/runtime concerns. The verbal phrase table, SVG\nrendering, Web Audio schedule, keyed response lifecycle, lesson path/replay,\nreference-card placement, checkpoint invitation and word-checkpoint run state do\nnot create learner-data stores.",
          )

          # Lesson contract: add the shipped #87 response policy and #88 milestone handoff.
          replace_once(
              "docs/MORSE_LESSON.md",
              "Issues #48, #51, #52, #56, #75, #76, #77 and #78. Parent #21. Preserves #28's",
              "Issues #48, #51, #52, #56, #75, #76, #77, #78, #87 and #88. Parent #21. Preserves #28's",
          )
          replace_once(
              "docs/MORSE_LESSON.md",
              "- `src/features/morse/MorseKeyInput.tsx` — shared letter → Morse response control;\n",
              "- `src/features/morse/MorseKeyInput.tsx` — shared letter → Morse response control;\n- `src/lib/morseResponse.ts` / `src/features/morse/useKeyedResponse.ts` — shared\n  keyed feedback/transition timing and interaction gate (#87);\n",
          )
          replace_once(
              "docs/MORSE_LESSON.md",
              "Pointer cancellation/lost capture produces no element. The key suppresses\nlong-press browser UI and touch scrolling while an active press is being\nclassified, so one press cannot accidentally become a dit plus a dah or a page\ngesture.\n\nThe #52 answer-safety rule remains:",
              "Pointer cancellation/lost capture produces no element. The key suppresses\nlong-press browser UI and touch scrolling while an active press is being\nclassified, so one press cannot accidentally become a dit plus a dah or a page\ngesture.\n\n#87 now owns the complete keyed-response boundary. Press duration chooses only\ndit versus dah; the shared audio path renders that accepted element completely,\nso a quick tap is not a clipped chirp and the final element finishes before the\nanswer advances. Once an answer commits, keyed input is inert through the brief\n`Correct`/wrong feedback dwell and target transition; automatic advance remains,\nbut the next target is not live until that transition is finished. Learn, replay\nand word checkpoints share this policy. Reduced motion may remove the visual\nmovement but never the input gate. The Morse key's pressed state is tactile and\ntonal/elevation-based rather than blue/accent. None of this changes lesson\nsupport, Test evidence, scoring, readiness or retention semantics.\n\nThe #52 answer-safety rule remains:",
          )
          replace_once(
              "docs/MORSE_LESSON.md",
              "The full word remains\nvisible while the current character is emphasized. Correct and wrong responses\nboth receive brief feedback and advance automatically; a miss changes nothing\noutside that transient feedback.\n\nLesson selection, replay and checkpoint selection remain microstate inside the\nexisting Learn route, preserving #45 browser History / Android Back behavior.",
              "The full word remains\nvisible while the current character is emphasized. Correct and wrong responses\nboth receive the shared #87 feedback/transition treatment and advance\nautomatically; a miss changes nothing outside that transient feedback.\n\n#88 adds the forward milestone handoff without adding checkpoint state. When\ncanonical progression newly unlocks the Lesson-4 or Lesson-7 checkpoint, the\nlesson completion boundary automatically presents a brief invitation. Starting\nthere enters the checkpoint directly. Skipping remains non-gating and leaves the\nunlocked checkpoint available from the lesson path; replay or later repair of an\nalready reached lesson does not recreate a first-unlock invitation. Completing a\ncheckpoint continues naturally into the lesson journey rather than requiring the\nlearner to rediscover their place.\n\nLesson selection, replay and checkpoint selection remain microstate inside the\nexisting Learn route, preserving #45 browser History / Android Back behavior.",
          )
          # Clarify any remaining shorthand that suggests the grading boundary is
          # synonymous with the expected-length instant.
          p = Path("docs/MORSE_LESSON.md")
          text = p.read_text()
          text = text.replace(
              "keyed entry starts blank, auto-grades once at expected length and exposes no",
              "keyed entry starts blank, commits once at expected length and exposes no",
          )
          p.write_text(text)

          # Word-checkpoint contract: reconcile #87 interaction and #88 automatic handoff.
          replace_once(
              "docs/MORSE_WORD_CHECKPOINTS.md",
              "Status: **implemented by #78**",
              "Status: **implemented by #78; integrated into the forward journey by #87/#88**",
          )
          replace_once(
              "docs/MORSE_WORD_CHECKPOINTS.md",
              "The canonical programme remains 13 lessons. A checkpoint never gates the next\nlesson and has no durable completion flag. Once a milestone has been reached,\nlater lesson reach is sufficient proof to keep that checkpoint available if\nrepair temporarily moves canonical Learn back to an older lesson.\n",
              "The canonical programme remains 13 lessons. A checkpoint never gates the next\nlesson and has no durable completion flag. Once a milestone has been reached,\nlater lesson reach is sufficient proof to keep that checkpoint available if\nrepair temporarily moves canonical Learn back to an older lesson. #88 additionally\nsurfaces a newly unlocked checkpoint automatically at the lesson-completion\nboundary; this is an ephemeral handoff event, not a second unlock database.\n",
          )
          replace_once(
              "docs/MORSE_WORD_CHECKPOINTS.md",
              "3. concise completion state;\n4. return to the lesson path.\n\nThe shipped word is `TIME`.",
              "3. concise completion state;\n4. continue naturally into the lesson journey.\n\nThe shipped word is `TIME`.",
          )
          replace_once(
              "docs/MORSE_WORD_CHECKPOINTS.md",
              "3. concise completion state;\n4. return to the lesson path.\n\nThe shipped words are `TRAIN` and `GARDEN`.",
              "3. concise completion state;\n4. continue naturally into the lesson journey.\n\nThe shipped words are `TRAIN` and `GARDEN`.",
          )
          replace_once(
              "docs/MORSE_WORD_CHECKPOINTS.md",
              "Checkpoint completion itself is not an acquisition prerequisite. A learner may\ncontinue to Lesson 5 or Lesson 8 without passing the checkpoint.\n\n## Interaction contract",
              "Checkpoint completion itself is not an acquisition prerequisite. A learner may\ncontinue to Lesson 5 or Lesson 8 without passing the checkpoint.\n\n## Automatic milestone handoff (#88)\n\nWhen canonical progression **newly** reaches Lesson 4 or Lesson 7, the completion\nboundary automatically offers the corresponding checkpoint before ordinary\nforward navigation resumes. The invitation is deliberately small: a restrained\nlesson-complete acknowledgement, a one-line explanation of the word activity and\nthe expected warm-up/word size. `Start checkpoint` enters it directly.\n\nSkipping is explicitly non-gating: the next lesson remains available and the\ncheckpoint remains on the lesson path for later voluntary use. Replaying Lesson 4\nor 7, or repairing an older lesson after the milestone was already reached, must\nnot falsely recreate a first-unlock event. Completing the checkpoint keeps the\nlearner in the Morse journey and offers the next canonical continuation. None of\nthese transitions writes checkpoint completion, skip or seen state.\n\n## Interaction contract",
          )
          replace_once(
              "docs/MORSE_WORD_CHECKPOINTS.md",
              "Touch duration remains categorical input only. It is not sending timing, WPM,\nor formal evidence.\n\n## Formative-only state boundary",
              "Touch duration remains categorical input only. It is not sending timing, WPM,\nor formal evidence. #87 separates that classification from the audible element:\nevery accepted dit/dah is rendered as a complete tone, the final tone finishes\nbefore the answer boundary advances, and the answer region remains locked through\nbrief visible correct/wrong feedback and the target transition. Automatic\nadvance remains. Reduced motion removes nonessential animation but not the safety\ngate, and the shared Morse key uses a tactile tonal/elevation press state rather\nthan blue/accent styling.\n\n## Formative-only state boundary",
          )
          replace_once(
              "docs/MORSE_WORD_CHECKPOINTS.md",
              "#78 automated coverage establishes:",
              "#78/#87/#88 automated coverage establishes:",
          )
          replace_once(
              "docs/MORSE_WORD_CHECKPOINTS.md",
              "After #78 is merged, the next product step is integrated real-device validation\nof the Morse journey before deciding whether the A–Z foundation is mature enough\nto open the next competency stream.",
              "With #87/#88 implemented on current `main`, the next gate is fresh integrated\nreal-device Pixel/PWA acceptance under #42 before deciding whether the A–Z\nfoundation is mature enough to open #29 or other later competency work.",
          )

          # Screen overhaul brief: make proposal authority unmistakable and preserve
          # the current PRODUCT contract until separate decisions ratify changes.
          replace_once(
              "docs/SCREEN_INVENTORY_REVIEW.md",
              "# Argus screen inventory and consolidation brief\n\n## Revised direction following owner feedback",
              "# Argus screen inventory and consolidation brief\n\n> **Authority status — proposed next programme, not current product behavior.**\n> This document contains the next major screen/learning-experience overhaul to be\n> revisited and designed before implementation. Its proposed information\n> architecture, assessment model and durable state do **not** supersede current\n> `PRODUCT.md`, `docs/PROGRESS_ARCHITECTURE.md` or shipped behavior merely by\n> appearing here. In particular, badges/achievement state, First Messages, new\n> milestone/freshness state, Home/Lessons navigation and removal of Progress are\n> unratified proposals. Badge concepts directly conflict with the current\n> `PRODUCT.md` anti-gamification contract and require an explicit product decision\n> before implementation. #90 may be reshaped or partly superseded by this\n> programme; it must not be implemented simply because it remains open.\n\n## Revised direction following owner feedback",
          )
          replace_once(
              "docs/SCREEN_INVENTORY_REVIEW.md",
              "These preferences are the design direction. Exact layout, assessment semantics and migration details remain decisions for the follow-up review.",
              "These preferences set the direction for the next design programme, not a ratified production contract. Exact layout, assessment semantics, migration/state changes and any conflict with current product principles must be resolved explicitly before implementation.",
          )
          replace_once(
              "docs/SCREEN_INVENTORY_REVIEW.md",
              "## Approved overhaul scope: Morse milestones and independent use",
              "## Proposed overhaul scope requiring ratification: Morse milestones and independent use",
          )
          replace_once(
              "docs/SCREEN_INVENTORY_REVIEW.md",
              "### Core decision",
              "### Proposed core decision",
          )
          replace_once(
              "docs/SCREEN_INVENTORY_REVIEW.md",
              "An achievement badge records that a milestone was once earned. It remains earned. Current practice and retention results describe how fresh the skill is, without rewriting achievement history.",
              "The proposal currently suggests that an achievement badge record a milestone once earned, while later practice/retention describe freshness. **This is not ratified production behavior:** current `PRODUCT.md` explicitly rejects badges/gamification, so this concept must be reconsidered or separately approved before any state/schema/UI implementation.",
          )
          replace_once(
              "docs/SCREEN_INVENTORY_REVIEW.md",
              "Ship these together:\n",
              "The proposal currently groups these for a possible first delivery; none is authorized for implementation by this document alone:\n",
          )

          # Review-only authorities should remain unchanged semantically.
          product = Path("PRODUCT.md").read_text()
          progress = Path("docs/PROGRESS_ARCHITECTURE.md").read_text()
          assert "Gamification: streaks, badges, XP" in product
          assert "Test remains the single scored recall interaction" in progress
          PY

      - name: Check documentation diff
        run: |
          git diff --check
          git diff -- README.md docs/MORSE_PROGRAMME_PLAN.md docs/MORSE_LESSON.md docs/MORSE_WORD_CHECKPOINTS.md docs/SCREEN_INVENTORY_REVIEW.md

      - name: Unit tests
        run: npm run test

      - name: Exact production build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_ARGUS_INBOX_UID: ${{ vars.VITE_ARGUS_INBOX_UID }}

      - name: Browser tests
        run: npm run test:browser

      - name: Firestore Security Rules
        run: npm run test:rules

      - name: Commit reconciled docs and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/foundation-housekeeping.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/MORSE_PROGRAMME_PLAN.md docs/MORSE_LESSON.md docs/MORSE_WORD_CHECKPOINTS.md docs/SCREEN_INVENTORY_REVIEW.md .github/workflows/foundation-housekeeping.yml
          test -n "$(git status --porcelain)"
          git commit -m "docs: reconcile foundation closeout truth"
          git push origin HEAD:housekeeping/foundation-closeout-20260912
