          - Auditory reception, sending, numerals/punctuation/prosigns, continuous copying, words/phrases and WPM competence are explicitly outside this completion claim.
          - \`src/lib/scheduling.ts\` is unchanged. A clean delayed Test that arrives before full bidirectional evidence remains \`drilled\` with its original \`drilledAt\` anchor; the retention gap is not reset or counterfeit-completed.

