          Implementation baseline: \`e24ca45b62be5348e26ca2f291f633e1fe56cda3\`  
          Rendered acceptance run: \`${GITHUB_RUN_ID}\`

          ## Curriculum boundary

          Completion claim: **Can independently recall all A–Z printed Morse mappings in both directions.**

