name: Issue 28 Implementation

on:
  push:
    branches:
      - issue-28-morse-a-z-curriculum
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused implementation
        run: python scripts/issue-28-implement.py

      - name: Install dependencies
        run: npm ci

      - name: Run full repository gate
        run: npm run check

      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/argus-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/argus/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/argus-preview.log
          exit 1

      - name: Run rendered mobile and accessibility acceptance
        run: node scripts/issue-28-browser-check.mjs

      - name: Commit validated implementation
        run: |
          git checkout -- package.json package-lock.json
          git config user.name "Argus acceptance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src docs/SEEDED_CONTENT_PROVENANCE.md
          git diff --cached --check
          git commit -m "Complete bidirectional Morse A-Z curriculum (#28)"
          git push origin HEAD:issue-28-morse-a-z-curriculum

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-28-rendered-evidence
          path: artifacts/issue-28-morse
          if-no-files-found: warn
