import type { Resolution } from './scheduling'
import type { CurrentLibrary, LegacyLibraryV4, Topic } from './types'

export const MORSE_TOPIC_ID = 'international-morse-letters-printed'
export const MORSE_COMPLETION_CLAIM = 'Can independently recall all A–Z printed Morse mappings in both directions.'

/**
 * The authored seed predates v5 item identity. Normalize it at the seed boundary
 * using the same deterministic ids as the v4 -> v5 storage migration, so every
 * non-Morse topic keeps its existing runtime identity and forward semantics.
 *
 * Workstream 5 widens only the existing Morse topic to bidirectional semantics;
 * retaining its topic id cleanly absorbs the temporary #23 control rather than
 * shipping a second overlapping completion claim.
 */
export function finalizeMorseCurriculumSeed(library: LegacyLibraryV4): CurrentLibrary {
  return {
    version: 5,
    topics: library.topics.map((topic) => ({
      ...topic,
      items: topic.items.map((item, index) => ({
        ...item,
        id: item.id?.trim() || migratedItemId(topic.id, index),
        kind: topic.id === MORSE_TOPIC_ID ? 'bidirectional' : item.kind ?? 'forward',
      })),
      itemEvidence: topic.itemEvidence ?? {},
    })),
  }
}

/**
 * A typed bidirectional item is a content claim, not a request to duplicate a
 * scheduler card. Completion therefore needs evidence for both required
 * directions of every such item while the deck remains 26 logical units.
 */
export function hasCompleteBidirectionalCoverage(topic: Topic): boolean {
  const bidirectional = topic.items.filter((item) => itemKind(item) === 'bidirectional')
  if (bidirectional.length === 0) return true
  return bidirectional.every((item) => {
    if (!item.id) return false
    return hasCompleteDirectionalCoverage(item, topic.itemEvidence?.[item.id])
  })
}

/**
 * Preserve the scheduler as the authority on retention timing while preventing
 * a wider typed content claim from reading as complete before its directions
 * have actually been demonstrated.
 *
 * If a clean delayed Test satisfies the retention gap before directional
 * coverage is complete, the topic stays drilled with the original drilledAt
 * anchor. The gap is neither reset nor skipped; subsequent voluntary Tests can
 * continue acquisition immediately. Once both directions are evidenced for all
 * bidirectional items, the unchanged scheduler result is allowed through.
 */
export function enforceDirectionalCompletion(before: Topic, resolution: Resolution): Resolution {
  if (!resolution.completed || hasCompleteBidirectionalCoverage(resolution.topic)) return resolution

  const history = [...resolution.topic.history]
  const last = history.at(-1)
  if (last) history[history.length - 1] = { ...last, resolvedTo: 'drilled' }

  return {
    ...resolution,
    topic: {
      ...resolution.topic,
      status: 'drilled',
      completedAt: before.completedAt,
      history,
    },
    to: 'drilled',
    completed: false,
    gapDays: null,
  }
}
''')

