name: Argus demo (GitHub Pages)

# Publishes the embeddable, local-only demo build to
# https://benwassa.github.io/argus/ so it can sit in an iframe.
#
# This is deliberately separate from `validate.yml` and from Firebase Hosting.
# Production (https://argus-b7a5a.web.app) is still deployed by hand from the
# CLI and is untouched by anything here. The demo needs no secrets and no
# repository variables: `vite build --mode demo` reads the committed
# `.env.demo`, which blanks every Firebase value, and the app ignores Firebase
# configuration in a demo build in any case.
#
# Pull requests only build and check the artifact. Only `main` (or a manual run
# on `main`) deploys.

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/demo-pages.yml'
      - '.env.demo'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argus-demo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the demo
        run: npm run build:demo

      # The properties that make the demo safe to host on a shared origin,
      # checked against the artifact itself rather than assumed.
      - name: Check the demo artifact
        run: |
          set -eu
          test -f dist-demo/index.html
          # Served from /argus/, so every asset must be under it.
          grep -q 'src="/argus/assets/' dist-demo/index.html
          # No service worker: the demo keeps nothing between visits.
          test ! -e dist-demo/sw.js
          # No Firebase web config baked in. (The Firebase SDK's own URLs are
          # in the bundle and are expected; a project id or API key is not.)
          if grep -rIlE 'argus-b7a5a|AIza[0-9A-Za-z_-]{35}' dist-demo; then
            echo 'Firebase project configuration is present in the demo build.' >&2
            exit 1
          fi

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-demo

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
