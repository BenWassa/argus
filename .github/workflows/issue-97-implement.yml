name: Issue 97 implementation gate

on:
  push:
    branches:
      - issue-97-browse-enrollment
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-97-implementation
  cancel-in-progress: true

jobs:
  implement-and-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: issue-97-browse-enrollment
          fetch-depth: 0

      - name: Apply focused implementation
        run: |
          python scripts/apply-issue-97.py
          python scripts/fix-issue-97-test.py

      - name: Remove implementation-only bootstrap files
        run: |
          rm scripts/apply-issue-97.py
          rm scripts/fix-issue-97-test.py
          rm .github/workflows/issue-97-implement.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firestore rules gate
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test

      - name: Type-check and production build
        run: npm run build

      - name: Browser tests
        run: npm run test:browser

      - name: Firestore Security Rules
        run: npm run test:rules

      - name: Inspect focused diff
        run: |
          git status --short
          git diff --check
          git diff --stat
          git grep -n -E "Read today|Read, ready to test|opening an ordinary topic is the exposure event" -- ':!docs/**' || true

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: separate topic browsing from learning enrollment"
          git push origin HEAD:issue-97-browse-enrollment
