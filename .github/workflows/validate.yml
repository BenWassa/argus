name: Argus CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      # A build sanity check, not a deploy artifact. Firebase Hosting is the
      # sole deployment target and is deployed manually from the CLI
      # (`npm run deploy:hosting`) rather than from CI; GitHub Pages is
      # retired. Repository variables may be absent on a pull request, in
      # which case the app intentionally builds with sync and the inbox both
      # unavailable — the supported local-only configuration.
      - name: Type-check and build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_ARGUS_INBOX_UID: ${{ vars.VITE_ARGUS_INBOX_UID }}

  # Answer confidentiality and the grading gesture are properties of a real
  # browser at a real size, so they are gated against the built app rather than
  # against JSDOM alone. Built without Firebase configuration: this suite
  # cannot sign in to real Google, and the entry boundary only exists for a
  # configured build, so it runs the local-only configuration instead.
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Security Rules are the trust boundary for everything the browser does to
  # sync and the content inbox, so they remain a separate explicit gate against
  # the real Firestore emulator.
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Firestore Security Rules
        run: npm run test:rules
