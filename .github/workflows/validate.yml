name: Validate Argus

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agent/impeccable-design-pass
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test, type-check and build
        run: npm run check
