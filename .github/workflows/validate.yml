name: Argus CI

on:
  pull_request:
    branches:
      - main
      # Integration branch for #225; sub-PRs land here before one PR to main.
      - feat/ui-overhaul
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      # A build sanity check, not a deploy artifact. Firebase Hosting is the
      # sole deployment target and is deployed manually from the CLI
      # (`npm run deploy:hosting`) rather than from CI; GitHub Pages is
      # retired. Repository variables may be absent on a pull request, in
      # which case the app intentionally builds with sync and the inbox both
      # unavailable — the supported local-only configuration.
      - name: Type-check and build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_ARGUS_INBOX_UID: ${{ vars.VITE_ARGUS_INBOX_UID }}

  # Answer confidentiality and the grading gesture are properties of a real
  # browser at a real size, so they are gated against the built app rather than
  # against JSDOM alone. Built without Firebase configuration: this suite
  # cannot sign in to real Google, and the entry boundary only exists for a
  # configured build, so it runs the local-only configuration instead.
  #
  # The suite is split into four Playwright shards (#273). Every test in every
  # viewport project still runs exactly once; only the runners change. Each
  # shard builds its own local-only artifact, so no build is shared across
  # configurations.
  browser-shard:
    name: browser-shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # A failure in one shard must not hide a failure in another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The system packages come from the runner's apt mirror, which now and then
      # stalls on one download (one shard lost 11 minutes to a single 5 MB font
      # package). apt waits 120s of silence by default; give up on a stalled
      # download after 15s and retry it instead. If the install still fails, a
      # killed apt leaves the dpkg lock held, so clear it before trying again.
      - name: Install Chromium
        run: |
          printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "5";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-fail-fast >/dev/null
          for attempt in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "Chromium install attempt $attempt did not finish; retrying"
            sudo pkill -KILL -x apt-get || true
            sudo pkill -KILL -x dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Browser tests
        run: npm run test:browser -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # The one stable browser check. It keeps the name `browser` so any branch
  # protection that requires it still applies, and it fails closed: it passes
  # only when every shard succeeded, never when one failed, was cancelled or
  # did not run.
  browser:
    needs: browser-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard to pass
        run: |
          echo "browser-shard result: ${{ needs.browser-shard.result }}"
          test "${{ needs.browser-shard.result }}" = "success"

  # Security Rules are the trust boundary for everything the browser does to
  # sync and the content inbox, so they remain a separate explicit gate against
  # the real Firestore emulator.
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Firestore Security Rules
        run: npm run test:rules
