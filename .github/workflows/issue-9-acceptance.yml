name: Issue 9 Acceptance

on:
  push:
    branches:
      - issue-9-structured-learn-content
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full repository gate
        run: npm run check

      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/argus-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/argus/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/argus-preview.log
          exit 1

      - name: Run rendered Learn acceptance
        run: node scripts/issue-9-browser-check.mjs

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-9-rendered-evidence
          path: artifacts/issue-9-learn
          if-no-files-found: warn
