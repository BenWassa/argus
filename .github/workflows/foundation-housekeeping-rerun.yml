name: Foundation housekeeping closeout rerun

on:
  push:
    branches:
      - housekeeping/foundation-closeout-20260912

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: housekeeping/foundation-closeout-20260912
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply reconciled documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/foundation-housekeeping.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace(
              'seamless milestone checkpoint handoff  \\n",',
              'seamless milestone checkpoint handoff\\n",',
          )
          exec(compile(script, 'foundation-housekeeping-reconcile', 'exec'))
          PY

      - name: Check documentation diff
        run: git diff --check

      - name: Unit tests
        run: npm run test

      - name: Exact production build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_ARGUS_INBOX_UID: ${{ vars.VITE_ARGUS_INBOX_UID }}

      - name: Browser tests
        run: npm run test:browser

      - name: Firestore Security Rules
        run: npm run test:rules

      - name: Commit reconciled docs and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/foundation-housekeeping.yml
          rm .github/workflows/foundation-housekeeping-rerun.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/MORSE_PROGRAMME_PLAN.md docs/MORSE_LESSON.md docs/MORSE_WORD_CHECKPOINTS.md docs/SCREEN_INVENTORY_REVIEW.md .github/workflows/foundation-housekeeping.yml .github/workflows/foundation-housekeeping-rerun.yml
          git commit -m "docs: reconcile foundation closeout truth"
          git push origin HEAD:housekeeping/foundation-closeout-20260912
