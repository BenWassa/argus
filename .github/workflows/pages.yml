name: Deploy Argus beta to GitHub Pages

on:
  push:
    branches:
      - main
      - agent/fast-practice-flow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static site
        run: |
          mkdir -p _site
          unzip -q argus-pwa.zip -d _site
          cp _site/argus-app.html _site/index.html
          cp impeccable.css impeccable.js interaction.css fast-practice.js _site/
          python3 - <<'PY'
          from pathlib import Path

          for name in ('argus-app.html', 'index.html'):
              path = Path('_site') / name
              html = path.read_text()
              html = html.replace('#111411', '#0f1210')
              html = html.replace(
                  '</head>',
                  '  <link rel="stylesheet" href="./impeccable.css" />\n'
                  '  <link rel="stylesheet" href="./interaction.css" />\n'
                  '</head>'
              )
              html = html.replace(
                  '</body>',
                  '  <script src="./impeccable.js"></script>\n'
                  '  <script src="./fast-practice.js"></script>\n'
                  '</body>'
              )
              path.write_text(html)

          manifest = Path('_site/manifest.webmanifest')
          manifest.write_text(manifest.read_text().replace('#111411', '#0f1210'))

          service_worker = Path('_site/sw.js')
          sw = service_worker.read_text().replace('argus-v1.0.0', 'argus-v1.2.0')
          sw = sw.replace(
              "'./argus-icon-512.png']",
              "'./argus-icon-512.png', './impeccable.css', './impeccable.js', './interaction.css', './fast-practice.js']"
          )
          service_worker.write_text(sw)
          PY
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
