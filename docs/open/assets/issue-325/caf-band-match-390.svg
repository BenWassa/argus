<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="390" height="844" viewBox="0 0 390 844"><title id="title">CAF ranks — 390px hierarchy match</title><desc id="desc">Proposed text-only CAF Master Corporal to Master Sailor equivalency match. No insignia.</desc><rect width="390" height="844" fill="#292f39"/><g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', sans-serif"><text x="23" y="32" font-size="13" fill="#d3d8e0" font-weight="600" text-anchor="start">9:41</text><text x="350" y="32" font-size="14" fill="#d3d8e0" font-weight="700" text-anchor="end">••  ▰</text><text x="24" y="72" font-size="33" fill="#d3d8e0" font-weight="400" text-anchor="start">‹</text><text x="58" y="67" font-size="12" fill="#d3d8e0" font-weight="700" text-anchor="start">CAF RANK EQUIVALENCIES</text><text x="366" y="67" font-size="13" fill="#d3d8e0" font-weight="650" text-anchor="end">1 / 6</text><text x="23" y="115" font-size="26" fill="#f7f8fa" font-weight="650" text-anchor="start">Junior member ladder</text><rect x="23" y="143" width="49" height="5" rx="2" fill="#efd66a" /><rect x="81" y="143" width="49" height="5" rx="2" fill="#677181" /><rect x="139" y="143" width="49" height="5" rx="2" fill="#677181" /><rect x="197" y="143" width="49" height="5" rx="2" fill="#677181" /><rect x="255" y="143" width="49" height="5" rx="2" fill="#677181" /><rect x="313" y="143" width="49" height="5" rx="2" fill="#677181" /><rect x="20" y="170" width="350" height="226" rx="14" fill="#363f4c" stroke="#677181" stroke-width="1"/><text x="38" y="197" font-size="12" fill="#d3d8e0" font-weight="700" text-anchor="start">LEVEL 16  ·  PRACTICAL LADDER</text><rect x="35" y="214" width="320" height="81" rx="9" fill="#414b58" /><text x="50" y="239" font-size="12" fill="#d3d8e0" font-weight="700" text-anchor="start">ARMY / RCAF</text><text x="50" y="271" font-size="21" fill="#f7f8fa" font-weight="650" text-anchor="start">Master Corporal</text><text x="332" y="271" font-size="14" fill="#f7f8fa" font-weight="650" text-anchor="end">MCpl</text><text x="39" y="322" font-size="12" fill="#efd66a" font-weight="700" text-anchor="start">APPOINTMENT, NOT A NEW RANK</text><text x="39" y="349" font-size="12" fill="#d3d8e0" font-weight="400" text-anchor="start">Underlying rank: Corporal / Sailor 1st Class.</text><text x="39" y="374" font-size="12" fill="#d3d8e0" font-weight="400" text-anchor="start">Choose the parallel RCN appointment.</text><text x="23" y="426" font-size="17" fill="#f7f8fa" font-weight="650" text-anchor="start">Which RCN title matches?</text><rect x="20" y="444" width="169" height="76" rx="10" fill="#363f4c" stroke="#80d3b9" stroke-width="2"/><text x="34" y="473" font-size="15" fill="#f7f8fa" font-weight="650" text-anchor="start">Master Sailor</text><text x="34" y="496" font-size="12" fill="#d3d8e0" font-weight="500" text-anchor="start">MS  ·  appointment</text><text x="177" y="467" font-size="15" fill="#80d3b9" font-weight="700" text-anchor="end">✓</text><rect x="201" y="444" width="169" height="76" rx="10" fill="#232a34" stroke="#e99ba0" stroke-width="2"/><text x="215" y="473" font-size="15" fill="#f7f8fa" font-weight="650" text-anchor="start">Sailor 1st Class</text><text x="215" y="496" font-size="12" fill="#d3d8e0" font-weight="500" text-anchor="start">S1  ·  substantive</text><text x="358" y="467" font-size="15" fill="#e99ba0" font-weight="700" text-anchor="end">×</text><rect x="20" y="530" width="169" height="76" rx="10" fill="#414b58" stroke="#677181" stroke-width="1"/><text x="34" y="559" font-size="15" fill="#f7f8fa" font-weight="650" text-anchor="start">Sailor 2nd Class</text><text x="34" y="582" font-size="12" fill="#d3d8e0" font-weight="500" text-anchor="start">S2  ·  trained</text><rect x="201" y="530" width="169" height="76" rx="10" fill="#414b58" stroke="#677181" stroke-width="1"/><text x="215" y="559" font-size="15" fill="#f7f8fa" font-weight="650" text-anchor="start">Petty Officer</text><text x="215" y="582" font-size="12" fill="#d3d8e0" font-weight="500" text-anchor="start">2nd Class  ·  PO2</text><rect x="20" y="628" width="350" height="120" rx="11" fill="#232a34" stroke="#e99ba0" stroke-width="1"/><text x="37" y="654" font-size="12" fill="#e99ba0" font-weight="750" text-anchor="start">CORRECTION · APPOINTMENT</text><text x="37" y="678" font-size="15" fill="#f7f8fa" font-weight="650" text-anchor="start">Master Sailor ↔ Master Corporal.</text><text x="37" y="704" font-size="14" fill="#d3d8e0" font-weight="400" text-anchor="start">Sailor 1st Class ↔ Corporal.</text><text x="37" y="727" font-size="12" fill="#d3d8e0" font-weight="400" text-anchor="start">MCpl/MS remains substantively Cpl/S1.</text><rect x="20" y="761" width="350" height="56" rx="12" fill="#efd66a" /><text x="195" y="796" font-size="17" fill="#29281c" font-weight="700" text-anchor="middle">Next match</text></g></svg>