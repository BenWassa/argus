<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="390" height="844" viewBox="0 0 390 844"><title id="title">SI prefixes — 390px log-power checkpoint</title><desc id="desc">Proposed mobile logarithmic power-scale checkpoint focusing on mega M versus milli m.</desc><rect width="390" height="844" fill="#292f39"/><g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', sans-serif"><text x="23" y="32" font-size="13" fill="#d3d8e0" font-weight="600" text-anchor="start">9:41</text><text x="350" y="32" font-size="14" fill="#d3d8e0" font-weight="700" text-anchor="end">••  ▰</text><text x="24" y="72" font-size="33" fill="#d3d8e0" font-weight="400" text-anchor="start">‹</text><text x="58" y="67" font-size="12" fill="#d3d8e0" font-weight="700" text-anchor="start">SI PREFIXES</text><text x="366" y="67" font-size="13" fill="#d3d8e0" font-weight="650" text-anchor="end">7 / 7</text><text x="23" y="116" font-size="27" fill="#f7f8fa" font-weight="650" text-anchor="start">Scale checkpoint</text><rect x="23" y="143" width="49" height="5" rx="2" fill="#efd66a" /><rect x="81" y="143" width="49" height="5" rx="2" fill="#efd66a" /><rect x="139" y="143" width="49" height="5" rx="2" fill="#efd66a" /><rect x="197" y="143" width="49" height="5" rx="2" fill="#efd66a" /><rect x="255" y="143" width="49" height="5" rx="2" fill="#efd66a" /><rect x="313" y="143" width="49" height="5" rx="2" fill="#efd66a" /><rect x="20" y="168" width="350" height="318" rx="14" fill="#363f4c" stroke="#677181" stroke-width="1"/><text x="36" y="195" font-size="12" fill="#d3d8e0" font-weight="700" text-anchor="start">POWERS OF TEN  ·  LOG₁₀</text><text x="37" y="223" font-size="11" fill="#bdc5d0" font-weight="650" text-anchor="start">MULTIPLES</text><text x="350" y="223" font-size="11" fill="#bdc5d0" font-weight="650" text-anchor="end">SYMBOL</text><text x="39" y="254" font-size="16" fill="#f7f8fa" font-weight="700" text-anchor="start">10⁹</text><text x="144" y="254" font-size="15" fill="#d3d8e0" font-weight="500" text-anchor="start">giga</text><text x="339" y="254" font-size="16" fill="#f7f8fa" font-weight="700" text-anchor="end">G</text><rect x="29" y="265.5" width="331" height="32" rx="7" fill="#232a34" stroke="#efd66a" stroke-width="2"/><text x="39" y="287.5" font-size="16" fill="#efd66a" font-weight="700" text-anchor="start">10⁶</text><text x="144" y="287.5" font-size="15" fill="#d3d8e0" font-weight="500" text-anchor="start">mega</text><text x="339" y="287.5" font-size="16" fill="#efd66a" font-weight="700" text-anchor="end">M</text><text x="39" y="321" font-size="16" fill="#f7f8fa" font-weight="700" text-anchor="start">10³</text><text x="144" y="321" font-size="15" fill="#d3d8e0" font-weight="500" text-anchor="start">kilo</text><text x="339" y="321" font-size="16" fill="#f7f8fa" font-weight="700" text-anchor="end">k</text><text x="39" y="354.5" font-size="16" fill="#f7f8fa" font-weight="700" text-anchor="start">10⁰</text><text x="144" y="354.5" font-size="15" fill="#d3d8e0" font-weight="500" text-anchor="start">base unit</text><text x="339" y="354.5" font-size="16" fill="#f7f8fa" font-weight="700" text-anchor="end">—</text><text x="39" y="388" font-size="16" fill="#f7f8fa" font-weight="700" text-anchor="start">10⁻³</text><text x="144" y="388" font-size="15" fill="#d3d8e0" font-weight="500" text-anchor="start">milli</text><text x="339" y="388" font-size="16" fill="#f7f8fa" font-weight="700" text-anchor="end">m</text><text x="39" y="421.5" font-size="16" fill="#f7f8fa" font-weight="700" text-anchor="start">10⁻⁶</text><text x="144" y="421.5" font-size="15" fill="#d3d8e0" font-weight="500" text-anchor="start">micro</text><text x="339" y="421.5" font-size="16" fill="#f7f8fa" font-weight="700" text-anchor="end">µ</text><text x="39" y="455" font-size="16" fill="#f7f8fa" font-weight="700" text-anchor="start">10⁻⁹</text><text x="144" y="455" font-size="15" fill="#d3d8e0" font-weight="500" text-anchor="start">nano</text><text x="339" y="455" font-size="16" fill="#f7f8fa" font-weight="700" text-anchor="end">n</text><text x="23" y="510" font-size="17" fill="#f7f8fa" font-weight="650" text-anchor="start">Which prefix is 10⁶?</text><rect x="20" y="527" width="169" height="62" rx="10" fill="#232a34" stroke="#e99ba0" stroke-width="2"/><text x="34" y="556" font-size="15" fill="#f7f8fa" font-weight="650" text-anchor="start">milli</text><text x="34" y="579" font-size="12" fill="#d3d8e0" font-weight="500" text-anchor="start">m  ·  10⁻³</text><text x="177" y="550" font-size="15" fill="#e99ba0" font-weight="700" text-anchor="end">×</text><rect x="201" y="527" width="169" height="62" rx="10" fill="#363f4c" stroke="#80d3b9" stroke-width="2"/><text x="215" y="556" font-size="15" fill="#f7f8fa" font-weight="650" text-anchor="start">mega</text><text x="215" y="579" font-size="12" fill="#d3d8e0" font-weight="500" text-anchor="start">M  ·  10⁶</text><text x="358" y="550" font-size="15" fill="#80d3b9" font-weight="700" text-anchor="end">✓</text><rect x="20" y="598" width="169" height="62" rx="10" fill="#414b58" stroke="#677181" stroke-width="1"/><text x="34" y="627" font-size="15" fill="#f7f8fa" font-weight="650" text-anchor="start">kilo</text><text x="34" y="650" font-size="12" fill="#d3d8e0" font-weight="500" text-anchor="start">k  ·  10³</text><rect x="201" y="598" width="169" height="62" rx="10" fill="#414b58" stroke="#677181" stroke-width="1"/><text x="215" y="627" font-size="15" fill="#f7f8fa" font-weight="650" text-anchor="start">micro</text><text x="215" y="650" font-size="12" fill="#d3d8e0" font-weight="500" text-anchor="start">µ  ·  10⁻⁶</text><rect x="20" y="680" width="350" height="70" rx="11" fill="#232a34" stroke="#e99ba0" stroke-width="1"/><text x="36" y="704" font-size="12" fill="#e99ba0" font-weight="750" text-anchor="start">CAPITAL M ≠ LOWERCASE m</text><text x="36" y="727" font-size="14" fill="#f7f8fa" font-weight="550" text-anchor="start">Mega M is 10⁶; milli m is 10⁻³.</text><rect x="