<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="390" height="844" viewBox="0 0 390 844"><title id="title">Greek alphabet — 390px correction state</title><desc id="desc">Proposed 390 pixel Signal-on-Slate screen showing Greek Nu and confusable letters, four touch choices and immediate correction.</desc><rect width="390" height="844" fill="#292f39"/><g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', sans-serif"><text x="23" y="32" font-size="13" fill="#d3d8e0" font-weight="600" text-anchor="start">9:41</text><text x="350" y="32" font-size="14" fill="#d3d8e0" font-weight="700" text-anchor="end">••  ▰</text><text x="24" y="72" font-size="33" fill="#d3d8e0" font-weight="400" text-anchor="start">‹</text><text x="58" y="67" font-size="12" fill="#d3d8e0" font-weight="700" text-anchor="start">GREEK ALPHABET</text><text x="366" y="67" font-size="13" fill="#d3d8e0" font-weight="650" text-anchor="end">3 / 6</text><text x="23" y="120" font-size="28" fill="#f7f8fa" font-weight="650" text-anchor="start">Similar capitals</text><rect x="23" y="143" width="49" height="5" rx="2" fill="#efd66a" /><rect x="81" y="143" width="49" height="5" rx="2" fill="#efd66a" /><rect x="139" y="143" width="49" height="5" rx="2" fill="#efd66a" /><rect x="197" y="143" width="49" height="5" rx="2" fill="#677181" /><rect x="255" y="143" width="49" height="5" rx="2" fill="#677181" /><rect x="313" y="143" width="49" height="5" rx="2" fill="#677181" /><rect x="20" y="174" width="350" height="181" rx="14" fill="#363f4c" stroke="#677181" stroke-width="1"/><text x="39" y="199" font-size="12" fill="#d3d8e0" font-weight="700" text-anchor="start">IDENTIFY THIS GREEK PAIR</text><text x="195" y="292" font-size="76" fill="#f7f8fa" font-weight="500" text-anchor="middle">Ν ν</text><text x="195" y="330" font-size="13" fill="#d3d8e0" font-weight="500" text-anchor="middle">Capital and lowercase forms</text><text x="23" y="390" font-size="17" fill="#f7f8fa" font-weight="650" text-anchor="start">Which English name matches?</text><rect x="20" y="409" width="169" height="70" rx="10" fill="#232a34" stroke="#e99ba0" stroke-width="2"/><text x="34" y="448" font-size="18" fill="#f7f8fa" font-weight="650" text-anchor="start">Eta</text><text x="177" y="432" font-size="15" fill="#e99ba0" font-weight="700" text-anchor="end">×</text><rect x="201" y="409" width="169" height="70" rx="10" fill="#363f4c" stroke="#80d3b9" stroke-width="2"/><text x="215" y="448" font-size="18" fill="#f7f8fa" font-weight="650" text-anchor="start">Nu</text><text x="358" y="432" font-size="15" fill="#80d3b9" font-weight="700" text-anchor="end">✓</text><rect x="20" y="490" width="169" height="70" rx="10" fill="#414b58" stroke="#677181" stroke-width="1"/><text x="34" y="529" font-size="18" fill="#f7f8fa" font-weight="650" text-anchor="start">Mu</text><rect x="201" y="490" width="169" height="70" rx="10" fill="#414b58" stroke="#677181" stroke-width="1"/><text x="215" y="529" font-size="18" fill="#f7f8fa" font-weight="650" text-anchor="start">Upsilon</text><rect x="20" y="582" width="350" height="125" rx="11" fill="#232a34" stroke="#e99ba0" stroke-width="1"/><text x="37" y="607" font-size="12" fill="#e99ba0" font-weight="750" text-anchor="start">CORRECTION · ETA ≠ NU</text><text x="37" y="632" font-size="15" fill="#f7f8fa" font-weight="600" text-anchor="start">Nu is Ν ν; Eta is Η η.</text><text x="37" y="654" font-size="14" fill="#d3d8e0" font-weight="400" text-anchor="start">The lowercase forms differ:</text><text x="37" y="677" font-size="13" fill="#d3d8e0" font-weight="400" text-anchor="start">ν forms a pointed v; η bends down.</text><rect x="20" y="738" width="350" height="58" rx="12" fill="#efd66a" /><text x="195" y="774" font-size="17" fill="#29281c" font-weight="700" text-anchor="middle">Continue lesson</text><text x="195" y="825" font-size="12" fill="#bdc5d0" font-weight="500" text-anchor="middle">Formative recall  ·  No Test score</text></g></svg>