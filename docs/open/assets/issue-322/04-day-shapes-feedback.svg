<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Read the Signal. Lesson 2  ·  Feedback"><rect width="390" height="844" fill="#21292e"/><text x="24" y="41" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="520" text-anchor="start">‹  Library</text><text x="366" y="41" fill="#efd26f" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="end">ARGUS</text><text x="24" y="87" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">Read the Signal</text><text x="24" y="115" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Lesson 2  ·  Feedback</text><rect x="24" y="132" width="342" height="5" rx="3" fill="#536168" stroke="none" stroke-width="1"/><rect x="24" y="132" width="153.9" height="5" rx="3" fill="#efd26f" stroke="none" stroke-width="1"/><line x1="0" y1="801" x2="390" y2="801" stroke="#445056" stroke-width="1" stroke-linecap="round"/><text x="195" y="824" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">ARGUS     ·     LIBRARY</text><rect x="24" y="166" width="342" height="213" rx="14" fill="#e6e8e2" stroke="none" stroke-width="1"/><circle cx="195" cy="202" r="21" fill="#151b1d"/><polygon points="195,243 221,272 195,301 169,272" fill="#151b1d"/><circle cx="195" cy="342" r="21" fill="#151b1d"/><rect x="24" y="399" width="342" height="67" rx="11" fill="#39464c" stroke="#d65a57" stroke-width="1"/><text x="44" y="426" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="600" text-anchor="start">You chose: Vessel aground</text><text x="44" y="448" fill="#f3b3ae" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start">Not quite · Different middle shape</text><rect x="24" y="482" width="342" height="130" rx="12" fill="#303b41" stroke="#70b9a2" stroke-width="1"/><text x="44" y="512" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="650" text-anchor="start">Correct: Restricted manoeuvre</text><text x="44" y="539" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Ball – diamond – ball.</text><text x="44" y="559" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Aground is three round balls.</text><text x="44" y="579" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Look at the shape in the middle.</text><rect x="24" y="634" width="342" height="61" rx="10" fill="#39464c" stroke="none" stroke-width="1"/><text x="44" y="657" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start">The lesson can continue after a correction.</text><text x="44" y="674" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start">This is not a formal Test attempt.</text><rect x="24" y="724" width="342" height="56" rx="13" fill="#efd26f" stroke="none" stroke-width="1"/><text x="195" y="759" fill="#252a29" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="650" text-anchor="middle">Try another signal</text></svg>