<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Beaufort Scale. Lesson 4  ·  Boundary check"><rect width="390" height="844" fill="#21292e"/><text x="24" y="41" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="520" text-anchor="start">‹  Library</text><text x="366" y="41" fill="#efd26f" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="end">ARGUS</text><text x="24" y="87" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">Beaufort Scale</text><text x="24" y="115" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Lesson 4  ·  Boundary check</text><rect x="24" y="132" width="342" height="5" rx="3" fill="#536168" stroke="none" stroke-width="1"/><rect x="24" y="132" width="215.46" height="5" rx="3" fill="#efd26f" stroke="none" stroke-width="1"/><line x1="0" y1="801" x2="390" y2="801" stroke="#445056" stroke-width="1" stroke-linecap="round"/><text x="195" y="824" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">ARGUS     ·     LIBRARY</text><text x="24" y="173" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">Measured wind speed: 34 knots</text><text x="24" y="194" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start">Which Beaufort force contains this value?</text><rect x="24" y="229" width="342" height="221" rx="13" fill="#303b41" stroke="none" stroke-width="1"/><text x="44" y="261" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="600" text-anchor="start">Adjacent wind-speed bands</text><rect x="44" y="283" width="302" height="61" rx="10" fill="#39464c" stroke="none" st