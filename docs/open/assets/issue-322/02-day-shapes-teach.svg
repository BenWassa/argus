<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Count the Balls. Lesson 1 of 4  ·  Learn"><rect width="390" height="844" fill="#21292e"/><text x="24" y="41" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="520" text-anchor="start">‹  Library</text><text x="366" y="41" fill="#efd26f" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="end">ARGUS</text><text x="24" y="87" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">Count the Balls</text><text x="24" y="115" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Lesson 1 of 4  ·  Learn</text><rect x="24" y="132" width="342" height="5" rx="3" fill="#536168" stroke="none" stroke-width="1"/><rect x="24" y="132" width="34.2" height="5" rx="3" fill="#efd26f" stroke="none" stroke-width="1"/><line x1="0" y1="801" x2="390" y2="801" stroke="#445056" stroke-width="1" stroke-linecap="round"/><text x="195" y="824" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">ARGUS     ·     LIBRARY</text><text x="24" y="173" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Count the round shapes. Read top to bottom.</text><rect x="24" y="197" width="342" height="344" rx="13" fill="#303b41" stroke="none" stroke-width="1"/><rect x="30" y="215" width="104" height="232" rx="9" fill="#e6e8e2" stroke="none" stroke-width="1"/><circle cx="79" cy="327" r="12" fill="#151b1d"/><text x="79" y="471" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="650" text-anchor="middle">1 ball</text><text x="79" y="493" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="450" text-anchor="middle">At anchor</text><rect x="144" y="215" width="104" height="232" rx="9" fill="#e6e8e2" stroke="none" stroke-width="1"/><circle cx="195" cy="296" r="12" fill="#151b1d"/><circle cx="195" cy="358" r="12" fill="#151b1d"/><text x="195" y="471" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="650" text-anchor="middle">2 balls</text><text x="195" y="493" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="450" text-anchor="middle">Not under</text><text x="195" y="511" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="450" text-anchor="middle">command</text><rect x="258" y="215" width="104" height="232" rx="9" fill="#e6e8e2" stroke="none" stroke-width="1"/><circle cx="311" cy="264" r="12" fill="#151b1d"/><circle cx="311" cy="327" r="12" fill="#151b1d"/><circle cx="311" cy="390" r="12" fill="#151b1d"/><text x="311" y="471" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="650" text-anchor="middle">3 balls</text><text x="311" y="493" fill="#b4c0c4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="450" text-anchor="middle">Aground</text><text x="36" y="568" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">The same black shape can appear at</text><text x="36" y="591" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">different sizes. Count it, not the pixels.</text><rect x="24" y="646" width="342" height="66" rx="10" fill="#39464c" stroke="none" stroke-width="1"/><text x="43" y="670" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Next: an unlabelled signal.</text><text x="43" y="689" fill="#f5f6f1" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Choose the state before seeing the answer.</text><rect x="24" y="731" width="342" height="56" rx="13" fill="#efd26f" stroke="none" stroke-width="1"/><text x="195" y="766" fill="#252a29" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="650" text-anchor="middle">Try a visual question</text></svg>