<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect width="390" height="844" fill="#101215"/><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#272c33"/><stop offset="1" stop-color="#1d2126"/></linearGradient></defs><path d="M0 0H390V50H0Z" fill="#16191d" opacity=".35"/><text x="20" y="48" font-family="system-ui, sans-serif" font-size="14" fill="#979fac" font-weight="400">‹  Morse code</text><text x="20" y="104" font-family="system-ui, sans-serif" font-size="33" fill="#e6eaf0" font-weight="600">Alphabet complete</text><text x="20" y="132" font-family="system-ui, sans-serif" font-size="13" fill="#979fac" font-weight="400">26 of 26  ·  Qualified Test recorded</text><rect x="20" y="164" width="350" height="171" rx="12" fill="#1d2126" stroke="#2a2f37"/><text x="36" y="193" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#868f9d" font-weight="600">A–Z TEST</text><text x="36" y="230" font-family="system-ui, sans-serif" font-size="26" fill="#e6eaf0" font-weight="600">All 26 letters</text><text x="36" y="263" font-family="system-ui, sans-serif" font-size="14" fill="#979fac" font-weight="400">Your independent recall is recorded.</text><text x="36" y="290" font-family="system-ui, sans-serif" font-size="13" fill="#979fac" font-weight="400">You can keep playing whenever you like.</text><text x="20" y="389" font-family="system-ui, sans-serif" font-size="22" fill="#e6eaf0" font-weight="600">Next: send your first words</text><text x="20" y="422" font-family="system-ui, sans-serif" font-size="14" fill="#979fac" font-weight="400">Use the Morse key to send five words.</text><rect x="20" y="447" width="350" height="54" rx="8" fill="#e9edf3" stroke="#e9edf3"/><text x="40" y="481" font-family="system-ui, sans-serif" font-size="16" fill="#0b0d10" font-weight="600">Send five words  →</text><rect x="20" y="523" width="350" height="49" rx="8" fill="#272c33" stroke="#3d4450"/><text x="35" y="555" font-family="system-ui, sans-serif" font-size="15" fill="#e6eaf0" font-weight="600">Listen &amp; Copy</text><text x="293" y="555" font-family="system-ui, sans-serif" font-size="19" fill="#979fac" font-weight="400">›</text><rect x="20" y="584" width="350" height="49" rx="8" fill="#272c33" stroke="#3d4450"/><text x="35" y="616" font-family="system-ui, sans-serif" font-size="15" fill="#e6eaf0" font-weight="600">All Morse games</text><text x="293" y="616" font-family="system-ui, sans-serif" font-size="19" fill="#979fac" font-weight="400">›</text><text x="20" y="707" font-family="system-ui, sans-serif" font-size="14" fill="#979fac" font-weight="400">Back to today</text><text x="20" y="768" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#868f9d" font-weight="500">Only shown after qualifying A–Z Test</text><path d="M0 808H390" stroke="#2a2f37"/><text x="20" y="831" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#868f9d" font-weight="600">ARGUS  /  DESIGN REVIEW ONLY</text></svg>