<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect width="390" height="844" fill="#101215"/><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#272c33"/><stop offset="1" stop-color="#1d2126"/></linearGradient></defs><path d="M0 0H390V50H0Z" fill="#16191d" opacity=".35"/><text x="20" y="48" font-family="system-ui, sans-serif" font-size="14" fill="#979fac" font-weight="400">‹  Morse code</text><text x="20" y="104" font-family="system-ui, sans-serif" font-size="33" fill="#e6eaf0" font-weight="600">Morse code</text><text x="20" y="132" font-family="system-ui, sans-serif" font-size="13" fill="#979fac" font-weight="400">Learning the alphabet  ·  8 of 26 letters</text><rect x="20" y="163" width="350" height="195" rx="12" fill="#1d2126" stroke="#2a2f37"/><text x="36" y="193" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#868f9d" font-weight="600">ALPHABET</text><text x="36" y="226" font-family="system-ui, sans-serif" font-size="23" fill="#e6eaf0" font-weight="600">Continue learning</text><text x="36" y="253" font-family="system-ui, sans-serif" font-size="14" fill="#979fac" font-weight="400">Keep working through the letters.</text><rect x="36" y="282" width="318" height="54" rx="8" fill="#e9edf3" stroke="#e9edf3"/><text x="53" y="316" font-family="system-ui, sans-serif" font-size="16" fill="#0b0d10" font-weight="600">Continue alphabet  →</text><text x="20" y="411" font-family="system-ui, sans-serif" font-size="22" fill="#e6eaf0" font-weight="600">Play with known letters</text><text x="20" y="439" font-family="system-ui, sans-serif" font-size="14" fill="#979fac" font-weight="400">A short word using only letters you've</text><text x="20" y="459" font-family="system-ui, sans-serif" font-size="14" fill="#979fac" font-weight="400">already learned. Practice is not a Test.</text><rect x="20" y="482" width="350" height="56" rx="8" fill="#272c33" stroke="#3d4450"/><text x="36" y="517" font-family="system-ui, sans-serif" font-size="16" fill="#e6eaf0" font-weight="600">Try a word  →</text><path d="M 20 576 h 350" stroke="#2a2f37"/><text x="20" y="613" font-family="system-ui, sans-serif" font-size="17" fill="#e6eaf0" font-weight="600">Later, when the alphabet is ready</text><text x="20" y="641" font-family="system-ui, sans-serif" font-size="14" fill="#979fac" font-weight="400">Send messages, copy audio and develop</text><text x="20" y="663" font-family="system-ui, sans-serif" font-size="14" fill="#979fac" font-weight="400">speed. No daily schedule or deadline.</text><text x="20" y="752" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#868f9d" font-weight="500">Example state: eligible learned-letter word</text><path d="M0 808H390" stroke="#2a2f37"/><text x="20" y="831" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#868f9d" font-weight="600">ARGUS  /  DESIGN REVIEW ONLY</text></svg>