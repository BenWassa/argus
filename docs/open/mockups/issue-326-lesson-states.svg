<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="844" viewBox="0 0 1170 844" role="img" aria-labelledby="t d">
<title id="t">Issue 326 proposed 390-pixel lesson mocks</title>
<desc id="d">Three separate 390 by 844 mobile views: OODA observation versus interpretation with feedback, ABCDE mnemonic order with incorrect-position feedback, and printed ACTS mnemonic recall without firearm interaction. Static design proposal, not product UI.</desc>

<g transform="translate(0 0)">
<rect x="0" y="0" width="390" height="844" rx="0" fill="#303942" stroke="none" stroke-width="1"/><rect x="0" y="0" width="390" height="58" rx="0" fill="#3e4852" stroke="none" stroke-width="1"/><text x="18" y="36" fill="#f4f6f7" font-size="19" font-weight="700" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">ARGUS</text><text x="373" y="36" fill="#c1cbd2" font-size="19" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="end">⋮</text><text x="20" y="82" fill="#c1cbd2" font-size="12" font-weight="600" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">OODA LOOP</text><text x="368" y="82" fill="#83c9d6" font-size="12" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="end">LESSON 3 / 4</text><rect x="20" y="91" width="350" height="5" rx="3" fill="#4b5660" stroke="none" stroke-width="1"/><rect x="20" y="91" width="262.5" height="5" rx="3" fill="#ead45b" stroke="none" stroke-width="1"/>
<text x="20" y="136" fill="#f4f6f7" font-size="25" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Seeing vs</text><text x="20" y="166" fill="#f4f6f7" font-size="25" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Interpreting</text>
<text x="20" y="214" fill="#c1cbd2" font-size="12" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">CHECK 1 OF 3</text>
<rect x="20" y="229" width="350" height="115" rx="12" fill="#3e4852" stroke="#6f7a85" stroke-width="1"/>
<text x="37" y="262" fill="#f4f6f7" font-size="15" font-weight="450" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">A dashboard shows checkout errors</text><text x="37" y="287" fill="#f4f6f7" font-size="15" font-weight="450" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">rose after the release.</text><text x="37" y="312" fill="#f4f6f7" font-size="15" font-weight="450" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Which OODA stage takes in this data?</text>
<rect x="20" y="364" width="350" height="62" rx="9" fill="#4b5660" stroke="#83c9d6" stroke-width="1"/><text x="34" y="400" fill="#f4f6f7" font-size="17" font-weight="550" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Observe</text>
<rect x="20" y="436" width="350" height="62" rx="9" fill="#4b5660" stroke="#6f7a85" stroke-width="1"/><text x="34" y="472" fill="#f4f6f7" font-size="17" font-weight="550" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Orient</text>
<rect x="20" y="508" width="350" height="62" rx="9" fill="#4b5660" stroke="#e6a4a4" stroke-width="1"/><text x="34" y="544" fill="#f4f6f7" font-size="17" font-weight="550" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Decide</text>
<rect x="20" y="580" width="350" height="62" rx="9" fill="#4b5660" stroke="#6f7a85" stroke-width="1"/><text x="34" y="616" fill="#f4f6f7" font-size="17" font-weight="550" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Act</text>
<rect x="20" y="652" width="350" height="95" rx="12" fill="#3e4852" stroke="#83c9d6" stroke-width="1"/>
<text x="37" y="677" fill="#83c9d6" font-size="14" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Correct answer: Observe</text>
<text x="37" y="702" fill="#f4f6f7" font-size="13" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">A measurement is an observation.</text><text x="37" y="720" fill="#f4f6f7" font-size="13" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Interpreting the cause comes later.</text>
<rect x="20" y="762" width="350" height="56" rx="9" fill="#ead45b" stroke="none" stroke-width="1"/>
<text x="195" y="797" fill="#2c2e19" font-size="17" font-weight="700" font-family="system-ui,Segoe UI,sans-serif" text-anchor="middle">Continue</text>
</g>
<g transform="translate(390 0)">
<rect x="0" y="0" width="390" height="844" rx="0" fill="#303942" stroke="none" stroke-width="1"/><rect x="0" y="0" width="390" height="58" rx="0" fill="#3e4852" stroke="none" stroke-width="1"/><text x="18" y="36" fill="#f4f6f7" font-size="19" font-weight="700" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">ARGUS</text><text x="373" y="36" fill="#c1cbd2" font-size="19" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="end">⋮</text><text x="20" y="82" fill="#c1cbd2" font-size="12" font-weight="600" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">PRIMARY SURVEY  ·  ABCDE</text><text x="368" y="82" fill="#83c9d6" font-size="12" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="end">LESSON 4 / 5</text><rect x="20" y="91" width="350" height="5" rx="3" fill="#4b5660" stroke="none" stroke-width="1"/><rect x="20" y="91" width="280" height="5" rx="3" fill="#ead45b" stroke="none" stroke-width="1"/>
<text x="20" y="143" fill="#f4f6f7" font-size="26" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Build the order</text>
<text x="20" y="176" fill="#c1cbd2" font-size="13" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Tap each heading to place it next.</text><text x="20" y="197" fill="#c1cbd2" font-size="13" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">This is mnemonic recall, not care advice.</text>
<text x="20" y="242" fill="#c1cbd2" font-size="12" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">YOUR SEQUENCE</text>
<rect x="20" y="256" width="350" height="53" rx="9" fill="#4b5660" stroke="#83c9d6" stroke-width="1"/><text x="34" y="287.5" fill="#f4f6f7" font-size="16" font-weight="550" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">1   Airway</text>
<rect x="20" y="316" width="350" height="53" rx="9" fill="#4b5660" stroke="#e6a4a4" stroke-width="1"/><text x="34" y="347.5" fill="#f4f6f7" font-size="16" font-weight="550" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">2   Circulation</text>
<rect x="20" y="376" width="350" height="53" rx="9" fill="#4b5660" stroke="#6f7a85" stroke-width="1"/><text x="34" y="407.5" fill="#c1cbd2" font-size="16" font-weight="550" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">3   —  Select a heading</text>
<text x="20" y="458" fill="#c1cbd2" font-size="12" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">AVAILABLE HEADINGS</text>
<rect x="20" y="469" width="170" height="53" rx="9" fill="#4b5660" stroke="#6f7a85" stroke-width="1"/><text x="34" y="500.5" fill="#f4f6f7" font-size="15" font-weight="550" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Breathing</text>
<rect x="200" y="469" width="170" height="53" rx="9" fill="#4b5660" stroke="#6f7a85" stroke-width="1"/><text x="214" y="500.5" fill="#f4f6f7" font-size="15" font-weight="550" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Disability</text>
<rect x="20" y="530" width="170" height="53" rx="9" fill="#4b5660" stroke="#6f7a85" stroke-width="1"/><text x="34" y="561.5" fill="#f4f6f7" font-size="15" font-weight="550" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Exposure</text>
<rect x="200" y="530" width="170" height="53" rx="9" fill="#4b5660" stroke="#6f7a85" stroke-width="1"/><text x="214" y="561.5" fill="#f4f6f7" font-size="15" font-weight="550" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Circulation</text>
<rect x="20" y="606" width="350" height="118" rx="12" fill="#3e4852" stroke="#83c9d6" stroke-width="1"/>
<text x="37" y="632" fill="#83c9d6" font-size="14" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Position 2: Breathing</text>
<text x="37" y="657" fill="#f4f6f7" font-size="13" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">A → Airway; B → Breathing.</text><text x="37" y="676" fill="#f4f6f7" font-size="13" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">C → Circulation. Reset to retry.</text><text x="37" y="695" fill="#f4f6f7" font-size="13" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">No clinical decisions are assessed.</text>
<rect x="20" y="758" width="350" height="56" rx="9" fill="#ead45b" stroke="none" stroke-width="1"/>
<text x="195" y="793" fill="#2c2e19" font-size="17" font-weight="700" font-family="system-ui,Segoe UI,sans-serif" text-anchor="middle">Reset order</text>
</g>
<g transform="translate(780 0)">
<rect x="0" y="0" width="390" height="844" rx="0" fill="#303942" stroke="none" stroke-width="1"/><rect x="0" y="0" width="390" height="58" rx="0" fill="#3e4852" stroke="none" stroke-width="1"/><text x="18" y="36" fill="#f4f6f7" font-size="19" font-weight="700" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">ARGUS</text><text x="373" y="36" fill="#c1cbd2" font-size="19" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="end">⋮</text><text x="20" y="82" fill="#c1cbd2" font-size="12" font-weight="600" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">FIREARM SAFETY</text><text x="368" y="82" fill="#83c9d6" font-size="12" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="end">LESSON 2 / 5</text><rect x="20" y="91" width="350" height="5" rx="3" fill="#4b5660" stroke="none" stroke-width="1"/><rect x="20" y="91" width="140" height="5" rx="3" fill="#ead45b" stroke="none" stroke-width="1"/>
<text x="20" y="144" fill="#f4f6f7" font-size="23" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Match the printed rule</text>
<text x="20" y="175" fill="#c1cbd2" font-size="13" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">ACTS / PROVE  ·  Text recall only</text><text x="20" y="196" fill="#c1cbd2" font-size="13" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Source: RCMP student handbook (2014)</text>
<rect x="20" y="234" width="350" height="104" rx="12" fill="#3e4852" stroke="#6f7a85" stroke-width="1"/>
<text x="38" y="261" fill="#c1cbd2" font-size="12" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">WHICH RULE BELONGS TO S?</text>
<text x="38" y="289" fill="#f4f6f7" font-size="14" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Choose the published wording.</text><text x="38" y="310" fill="#f4f6f7" font-size="14" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">No equipment or handling interaction.</text>
<rect x="20" y="354" width="350" height="90" rx="10" fill="#4b5660" stroke="#83c9d6" stroke-width="1"/>
<text x="36" y="384" fill="#f4f6f7" font-size="15" font-weight="550" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">See that the firearm is unloaded —</text><text x="36" y="408" fill="#f4f6f7" font-size="15" font-weight="550" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">PROVE it safe.</text>
<rect x="20" y="457" width="350" height="90" rx="10" fill="#4b5660" stroke="#6f7a85" stroke-width="1"/>
<text x="36" y="487" fill="#f4f6f7" font-size="15" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Assume every firearm is loaded.</text><text x="36" y="511" fill="#f4f6f7" font-size="15" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">(A, not S)</text>
<rect x="20" y="565" width="350" height="116" rx="12" fill="#3e4852" stroke="#83c9d6" stroke-width="1"/>
<text x="36" y="594" fill="#83c9d6" font-size="14" font-weight="650" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">The fourth ACTS statement is S.</text>
<text x="36" y="620" fill="#f4f6f7" font-size="13" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">A printed statement is all this checks.</text><text x="36" y="639" fill="#f4f6f7" font-size="13" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">Review the original handbook wording;</text><text x="36" y="658" fill="#f4f6f7" font-size="13" font-weight="400" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">do not infer handling competence.</text>
<text x="20" y="714" fill="#c1cbd2" font-size="11" font-weight="600" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">MEMORY ONLY · NOT CFSC TRAINING,</text><text x="20" y="730" fill="#c1cbd2" font-size="11" font-weight="600" font-family="system-ui,Segoe UI,sans-serif" text-anchor="start">PRACTICAL TESTING OR LICENSING</text>
<rect x="20" y="758" width="350" height="56" rx="9" fill="#ead45b" stroke="none" stroke-width="1"/>
<text x="195" y="793" fill="#2c2e19" font-size="17" font-weight="700" font-family="system-ui,Segoe UI,sans-serif" text-anchor="middle">Continue</text>
</g>
