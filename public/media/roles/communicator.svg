<linearGradient id="rope" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5d300e"/><stop offset=".2" stop-color="#c18432"/><stop offset=".39" stop-color="#ffefaf"/><stop offset=".6" stop-color="#db9940"/><stop offset=".82" stop-color="#8b4c18"/><stop offset="1" stop-color="#55300e"/></linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fa7862"/><stop offset=".51" stop-color="#a93130"/><stop offset="1" stop-color="#601c28"/></linearGradient>
