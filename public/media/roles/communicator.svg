<style><![CDATA[
/* Layers remain independent for future earned-only timelines; this SVG contains no bitmap. */
@media (prefers-reduced-motion: no-preference) {
  svg:hover #signal-left { animation: receive 840ms ease-out 1; }
  svg:hover #signal-right { animation: receive 840ms ease-out 1 80ms; }
  svg:hover #compass-rose { animation: compass-light 880ms ease-out 1; }
}
@keyframes receive { 0% { opacity: .5 } 50% { opacity: 1; filter: brightness(1.16) } 100% { opacity: 1 } }
@keyframes compass-light { 0% { filter: brightness(.8) } 45% { filter: brightness(1.24) } 100% { filter: brightness(1) } }
]]></style>
