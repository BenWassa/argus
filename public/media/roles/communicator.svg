<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="badge-title badge-desc">
<title id="badge-title">Argus Communicator achievement</title>
<desc id="badge-desc">Original nautical medallion with raised rope rim, transmission mast and radio signals, International Code of Signals flags November, Zulu, Victor and Alfa, Morse A (dit dah) and Z (dah dah dit dit), ocean waves and compass rose, rendered in polished gold and blue enamel.</desc>
<defs>
<radialGradient id="enamel" cx=".47" cy=".15" r=".87"><stop stop-color="#17618a"/><stop offset=".34" stop-color="#0b3b65"/><stop offset=".75" stop-color="#06233d"/><stop offset="1" stop-color="#03131f"/></radialGradient>
<radialGradient id="surface-light" cx=".45" cy="-.06" r=".83"><stop stop-color="#7bc9ed" stop-opacity=".24"/><stop offset=".5" stop-color="#23608a" stop-opacity=".05"/><stop offset="1" stop-color="#092b48" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#643512"/><stop offset=".14" stop-color="#d29a45"/><stop offset=".29" stop-color="#fff2bc"/><stop offset=".49" stop-color="#bd7727"/><stop offset=".71" stop-color="#e9b15e"/><stop offset=".84" stop-color="#ffe4a1"/><stop offset="1" stop-color="#70401a"/></linearGradient>
<linearGradient id="gold-top" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff3bc"/><stop offset=".25" stop-color="#d99d47"/><stop offset=".52" stop-color="#9c5b21"/><stop offset=".81" stop-color="#eabb6c"/><stop offset="1" stop-color="#623512"/></linearGradient>
